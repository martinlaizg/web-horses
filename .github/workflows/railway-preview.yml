name: Railway Preview Deployment

on:
  pull_request:
    types: [labeled, opened, synchronize, unlabeled]
  workflow_dispatch:

jobs:
  check-label:
    if: github.event_name == 'pull_request' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check for preview label
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'preview';
            
            // For opened/synchronize events, check current labels
            if (context.eventName === 'pull_request' && 
                (context.payload.action === 'opened' || context.payload.action === 'synchronize')) {
              const hasLabel = context.payload.pull_request.labels.some(
                label => label.name === labelName
              );
              core.setOutput('should-deploy', hasLabel);
              return;
            }
            
            // For labeled event, check if the added label is our preview label
            if (context.eventName === 'pull_request' && context.payload.action === 'labeled') {
              const addedLabel = context.payload.label.name;
              const shouldDeploy = addedLabel === labelName;
              core.setOutput('should-deploy', shouldDeploy);
              return;
            }
            
            // Default to false
            core.setOutput('should-deploy', false);

  deploy-preview:
    needs: check-label
    if: needs.check-label.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Configure Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          export RAILWAY_TOKEN=$RAILWAY_TOKEN
          railway link $RAILWAY_PROJECT_ID

      - name: Build Docker image
        run: docker build -t web-horses-preview .

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Create a unique service name for this PR
          SERVICE_NAME="web-horses-pr-${PR_NUMBER}"
          
          # Deploy with Railway
          railway up --service-name $SERVICE_NAME --detach
          
          # Wait for deployment to complete
          sleep 30
          
          # Get the service URL
          SERVICE_URL=$(railway status --json | jq -r '.services[] | select(.name == "'"$SERVICE_NAME"'") | .url' 2>/dev/null || echo "")
          
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="https://${SERVICE_NAME}.up.railway.app"
          fi
          
          echo "PREVIEW_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { PREVIEW_URL, PR_NUMBER } = process.env;
            
            if (!PREVIEW_URL) {
              console.log('No preview URL generated, skipping comment');
              return;
            }
            
            const commentBody = ':rocket: **Railway Preview Deployment**\n\n' +
              'Tu PR tiene un entorno de previsualizacion listo para probar:\n\n' +
              ':globe_with_meridians: **URL:** ' + PREVIEW_URL + '\n\n' +
              'Este entorno se eliminara automaticamente cuando el PR se fusione o cierre.';
            
            // Check if a preview comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: PR_NUMBER,
            });
            
            const previewComment = comments.find(c => 
              c.body.includes('Railway Preview Deployment') && 
              c.user.login === 'github-actions[bot]'
            );
            
            if (previewComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PR_NUMBER,
                body: commentBody,
              });
            }

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if preview label was removed
        id: check-unlabeled
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'preview';
            const removedLabel = context.payload.label.name;
            const shouldCleanup = removedLabel === labelName;
            core.setOutput('should-cleanup', shouldCleanup);

      - name: Delete Railway service
        if: steps.check-unlabeled.outputs.should-cleanup == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export RAILWAY_TOKEN=$RAILWAY_TOKEN
          SERVICE_NAME="web-horses-pr-${PR_NUMBER}"
          # Delete the service for this PR
          railway delete --service $SERVICE_NAME --yes 2>/dev/null || true
