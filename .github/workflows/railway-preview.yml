name: Railway Preview Deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Configure Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          railway login --token $RAILWAY_TOKEN
          railway link $RAILWAY_PROJECT_ID

      - name: Build Docker image
        run: docker build -t web-horses-preview .

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          # Create a unique service name for this PR
          SERVICE_NAME="web-horses-pr-${PR_NUMBER}"
          
          # Deploy with Railway
          railway up --service-name $SERVICE_NAME --detach
          
          # Wait for deployment to complete
          sleep 30
          
          # Get the service URL
          SERVICE_URL=$(railway status --json | jq -r '.services[] | select(.name == "'"$SERVICE_NAME"'") | .url' 2>/dev/null || echo "")
          
          if [ -z "$SERVICE_URL" ]; then
            # Fallback: try to get URL from railway info
            SERVICE_URL=$(railway info --json 2>/dev/null | jq -r '.url' || echo "")
            if [ -z "$SERVICE_URL" ]; then
              SERVICE_URL="https://${SERVICE_NAME}.up.railway.app"
            fi
          fi
          
          echo "PREVIEW_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { PREVIEW_URL, PR_NUMBER } = process.env;
            
            if (!PREVIEW_URL) {
              console.log('No preview URL generated, skipping comment');
              return;
            }
            
            const commentBody = `
:rocket: **Railway Preview Deployment**

Tu PR tiene un entorno de previsualización listo para probar:

🌐 **URL:** ${PREVIEW_URL}

Este entorno se eliminará automáticamente cuando el PR se fusione o cierre.
            `;
            
            // Check if a preview comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: PR_NUMBER,
            });
            
            const previewComment = comments.find(c => 
              c.body.includes('Railway Preview Deployment') && 
              c.user.login === 'github-actions[bot]'
            );
            
            if (previewComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PR_NUMBER,
                body: commentBody,
              });
            }

      - name: Cleanup old preview deployments
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          railway login --token $RAILWAY_TOKEN
          SERVICE_NAME="web-horses-pr-${PR_NUMBER}"
          # Delete the service for this PR
          railway delete --service $SERVICE_NAME --yes 2>/dev/null || true
