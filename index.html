<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Pedido de suministros para caballos</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<main class="app">
		<section class="card">
			<header class="header">
				<p class="eyebrow">Suministros</p>
				<h1>Pedido para caballos</h1>
			</header>

			<div class="items" aria-label="Lista de productos">
				<div class="item-row" data-item="paja">
					<label class="item-name" for="paja-cantidad">Paja</label>
					<div class="field">
						<label for="paja-cantidad">Cantidad</label>
						<input id="paja-cantidad" type="number" min="0" step="1" inputmode="numeric" value="0" />
					</div>
					<div class="field">
						<label for="paja-precio">Precio</label>
						<input id="paja-precio" type="number" min="0" step="0.01" value="4.5" />
					</div>
					<div class="item-total">
						<span>Total</span>
						<strong id="paja-total">0,00 €</strong>
					</div>
				</div>

				<div class="item-row" data-item="alfalfa">
					<label class="item-name" for="alfalfa-cantidad">Alfalfa</label>
					<div class="field">
						<label for="alfalfa-cantidad">Cantidad</label>
						<input id="alfalfa-cantidad" type="number" min="0" step="1" inputmode="numeric" value="0" />
					</div>
					<div class="field">
						<label for="alfalfa-precio">Precio</label>
						<input id="alfalfa-precio" type="number" min="0" step="0.01" value="5.5" />
					</div>
					<div class="item-total">
						<span>Total</span>
						<strong id="alfalfa-total">0,00 €</strong>
					</div>
				</div>

				<div class="item-row" data-item="baio">
					<label class="item-name" for="baio-cantidad">Baio</label>
					<div class="field">
						<label for="baio-cantidad">Cantidad</label>
						<input id="baio-cantidad" type="number" min="0" step="1" inputmode="numeric" value="0" />
					</div>
					<div class="field">
						<label for="baio-precio">Precio</label>
						<input id="baio-precio" type="number" min="0" step="0.01" value="5" />
					</div>
					<div class="item-total">
						<span>Total</span>
						<strong id="baio-total">0,00 €</strong>
					</div>
				</div>

				<div class="item-row" data-item="viruta">
					<label class="item-name" for="viruta-cantidad">Viruta</label>
					<div class="field">
						<label for="viruta-cantidad">Cantidad</label>
						<input id="viruta-cantidad" type="number" min="0" step="1" inputmode="numeric" value="0" />
					</div>
					<div class="field">
						<label for="viruta-precio">Precio</label>
						<input id="viruta-precio" type="number" min="0" step="0.01" value="7" />
					</div>
					<div class="item-total">
						<span>Total</span>
						<strong id="viruta-total">0,00 €</strong>
					</div>
				</div>
			</div>

			<div class="summary" aria-live="polite">
				<span>Total del pedido</span>
				<strong id="total-general">0,00 €</strong>
			</div>
		</section>
	</main>

	<script src="script.js"></script>
</body>

</html>
